name: Keep backend awake

# Backup for the server's own self-ping: pings the Render backend from outside
# every 10 minutes. If the server ever fell asleep (e.g. after a restart), this
# wakes it up again so the app never waits ~50s for a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://fish-fresh-backend.onrender.com/api/ping || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Backend did not answer 200 (may still be deploying)"
